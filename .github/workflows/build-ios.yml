CERT_PATH="$RUNNER_TEMP/apple_development.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios_development.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain-db"

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PROFILE_PLIST" | sed 's/^[^.]*\.//')

          if [ "$PROFILE_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "Provisioning profile bundle ID ($PROFILE_BUNDLE_ID) does not match $BUNDLE_ID"
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive for physical iPhone
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project UmrahGuide.xcodeproj \
            -scheme UmrahGuide \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/UmrahGuide.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY='Apple Development' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            clean archive | tee archive.log

      - name: Create export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string>
            </dict>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export signed development IPA
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/UmrahGuide.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" | tee export.log
          test -f "$RUNNER_TEMP/ipa-export/Umrah Guide.ipa" || test -f "$RUNNER_TEMP/ipa-export/UmrahGuide.ipa"
          mkdir -p output
          find "$RUNNER_TEMP/ipa-export" -maxdepth 1 -name '*.ipa' -exec cp {} output/ \;
          ls -lh output

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umrah-Guide-Development-IPA
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Umrah-Guide-iOS-build-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup temporary signing files
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple_development.p12" "$RUNNER_TEMP/ios_development.mobileprovision" "$RUNNER_TEMP/profile.plist"
